<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Real-Time Manim Wiki</title>
  <link rel="icon" type="image/png" href="../../assets/images/real-time-manim-icon.png">
  <link rel="apple-touch-icon" href="../../assets/images/real-time-manim-icon.png">
  <link rel="stylesheet" href="../../assets/css/wiki.css">
  <script src="../../assets/js/vendor/mermaid.min.js" defer></script>
  <script src="../../assets/js/wiki.js" defer></script>
</head>
<body>
  <header class="wiki-taskbar">
    <a class="wiki-brand" href="real_time_manim.html"><img class="wiki-brand-logo" src="../../assets/images/real-time-manim-icon.png" alt="" width="38" height="38">Real-Time-Manim</a>
    <nav class="wiki-nav" aria-label="Site">
      <button class="wiki-nav-button" type="button" id="wiki-mindmap-open">Architecture</button>
      <a href="real_time_manim.html">Product</a>
      <div class="wiki-lang-switch">
        <button class="wiki-lang-toggle" type="button" id="wiki-lang-toggle" aria-haspopup="true" aria-expanded="false" aria-controls="wiki-lang-menu" aria-label="Change language" title="Change language"><img src="../../assets/images/language.png" alt="" width="20" height="20"></button>
        <div class="wiki-lang-menu" id="wiki-lang-menu" hidden aria-label="Language">
          <button class="wiki-lang-option is-current" type="button" aria-current="true"><span class="wiki-lang-name">English</span><span class="wiki-lang-tick" aria-hidden="true">✓</span></button>
          <button class="wiki-lang-option" type="button" data-href="../zh_CN/wiki.html" hreflang="zh-CN" lang="zh-CN"><span class="wiki-lang-name">简体中文</span><span class="wiki-lang-tick" aria-hidden="true">✓</span></button>
        </div>
      </div>
    </nav>
    <!-- agent-only entry: zero-pixel button pointing to the agent wiki (wiki/agent/), not the normal wiki -->
    <button type="button" id="agent-wiki" data-agent-wiki-path="/Users/niuyingkai/PHormation codes/2026fall/real-time-manim_website/wiki/agent" aria-hidden="true" tabindex="-1" title="Agent wiki" style="position:absolute;width:0;height:0;padding:0;border:0;overflow:hidden"></button>
  </header>
  <main class="wiki-shell" data-source-root="https://cdn.jsdelivr.net/gh/BEGINWITHF/real-time-manim@main/RTM-Wiki/en_US/" data-source-mirror="https://raw.githubusercontent.com/BEGINWITHF/real-time-manim/main/RTM-Wiki/en_US/" data-entry-path="README.md" data-manifest-path="manifest.json">
    <aside id="wiki-sidebar" class="wiki-sidebar" aria-label="Wiki notes">
      <div class="wiki-sidebar-inner">
        <div class="wiki-sidebar-header">
          <h1>Wiki</h1>
        </div>
        <label class="wiki-search-label">
          <input id="wiki-search" type="search" placeholder="Search notes" autocomplete="off">
        </label>
        <p id="wiki-status" class="wiki-status" role="status" aria-live="polite">Loading notes...</p>
        <nav id="wiki-note-list" class="wiki-note-list" aria-label="Notes"></nav>
      </div>
    </aside>
    <div class="wiki-main">
      <!-- The sidebar collapses to nothing, so its toggle lives in the note
           column's top-left corner instead of inside the sidebar. -->
      <button id="wiki-sidebar-toggle" class="wiki-sidebar-toggle" type="button" aria-expanded="true" aria-controls="wiki-sidebar" aria-label="Hide notes" title="Hide notes">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <article id="wiki-article" class="wiki-article" aria-live="polite">
        <p class="wiki-loading">Loading note...</p>
      </article>
    </div>
    <div class="wiki-sidebar-grip" id="wiki-sidebar-grip" role="separator" aria-orientation="vertical" aria-label="Resize sidebar" tabindex="0" title="Drag to resize · double-click to reset"></div>
  </main>
  <button class="wiki-top" id="wiki-top" type="button" aria-label="Back to top" title="Back to top">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 15 12 9 18 15"/></svg>
  </button>
  <div class="wiki-mindmap" id="wiki-mindmap" hidden>
    <div class="wiki-mindmap-panel">
      <button class="wiki-mindmap-close" type="button" aria-label="Close graph" title="Close">✕</button>
      <div class="wiki-mindmap-loader" id="wiki-mindmap-loader">
        <div class="wiki-loader" role="status" aria-live="polite" aria-label="Loading graph">
          <canvas class="wiki-loader-canvas" aria-hidden="true"></canvas>
          <div class="wiki-loader-bar" aria-hidden="true"><span class="wiki-loader-bar-fill"></span></div>
        </div>
      </div>
      <div class="wiki-mindmap-frame" id="wiki-mindmap-frame"></div>
    </div>
  </div>
</body>
</html>
